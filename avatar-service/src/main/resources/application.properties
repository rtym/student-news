spring.application.name=avatar-service

# Every setting comes from an environment variable, with a default.
server.port=${PORT:8090}
avatars.upload-dir=${UPLOAD_DIR:/data/avatars}
avatars.max-bytes=${MAX_BYTES:2097152}

# Start the DispatcherServlet with the application rather than on the first
# request, and keep Spring from logging a second line for a 405, so the
# request log really is one line per request.
spring.mvc.servlet.load-on-startup=1
logging.level.org.springframework.web.servlet.PageNotFound=error

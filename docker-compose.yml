services:
  db:
    image: postgres:16-alpine
    container_name: student-news-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_news}
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend
    container_name: student-news-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-student_news}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-student}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./frontend
    container_name: student-news-frontend

    depends_on:
      - backend

    ports:
      - "5173:8080"


  avatar-service:
    build:
      context: ./avatar-service
    container_name: avatar-service

    ports:
      - "8090:8090"

    environment:
      PORT: "8090"
      UPLOAD_DIR: /data/avatars
      MAX_BYTES: "1048576"

    volumes:
      - avatar_data:/data/avatars

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8090/health
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  avatar_data:
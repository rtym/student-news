name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    name: Frontend · lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint

  backend-test:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run unit tests
        working-directory: backend
        run: mvn -B test -Dtest='!*IntegrationTest,!*E2ETest'
      - name: Publish unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-build:
    name: Frontend · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-node${{ matrix.node }}
          path: frontend/dist/
          retention-days: 7

  integration-test:
    name: Backend · integration tests
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run integration tests with Testcontainers
        working-directory: backend
        run: mvn -B test -Dtest='*IntegrationTest,*E2ETest'
      - name: Publish integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  package:
    name: Package · container images (${{ matrix.service }})
    needs: [frontend-lint, backend-test, frontend-build, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: student-news-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-status:
    name: CI status
    if: always()
    needs: [frontend-lint, backend-test, frontend-build, integration-test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any stage did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A required CI stage failed, was cancelled, or was skipped."
          exit 1
      - name: All stages passed
        run: echo "Lint, unit tests, integration tests, frontend matrix, and packaging are green."

name: Backend tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # The API integration tests start PostgreSQL through Testcontainers.
      - name: Check Docker is available
        run: docker info

      - name: Build and run all backend tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean install

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-full-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

# Dependency updates arrive as pull requests, which means they go through the
# same CI pipeline as any other change. Nothing is merged because it is "just
# a bump" — the tests still have to pass.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # A new Postgres major cannot read the previous major's data directory:
      # that upgrade needs a dump and restore, not a tag bump. The
      # Testcontainers tests also pin postgres:16-alpine.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
